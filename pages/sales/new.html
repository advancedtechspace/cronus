<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRONUS</title>
    <link
      rel="shortcut icon"
      href="../../assets/logo.svg"
      type="image/x-icon"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="../../libraries/js/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="../../libraries/css/sweetalert2.min.css" />
    <link rel="stylesheet" href="../../libraries/css/line-awesome.min.css" />
    <link rel="stylesheet" href="../../css/main.css" />
  </head>
  <body>
    <header>
      <a href="/" class="logo">
        <img src="../../assets/logo.svg" width="30" height="30" />
        <h1>CRONUS</h1>
      </a>
      <a id="a-dashboard" href="#">
        <img width="20" height="20" src="../../assets/user.svg" alt="user" />
      </a>
    </header>
    <main>
      <div id="suggestions"></div>
      <div class="main">
        <div class="main-header">
          <h3>Efectuar nova venda</h3>
        </div>
        <div class="main-body">
          <form id="form-new-sell">
            <div class="form">
              <div class="form-group">
                <label for="select-product">Producto:</label>
                <select
                  class="select2"
                  type="text"
                  name="categoria"
                  id="select-product"
                ></select>
                <div class="form-group">
                  <label for="valor">Quantidade: </label>
                  <input
                    type="number"
                    class="input-thin"
                    name="quantidade"
                    id="quantidade"
                    min="1"
                    required
                    value="1"
                  />
                </div>

                <button class="btn-circle" id="btn-add-product">
                  <i class="la la-plus-circle"></i>
                </button>
              </div>
              <table width="100%">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </form>
        </div>
        <div class="main-footer">
          <h2 id="total-a-pagar">Total a pagar: 0,0</h2>
          <div class="form-group">
            <label for="client-name">Nome do cliente *:</label>
            <input
              type="text"
              name="client-name"
              id="client-name"
              placeholder=""
              required
            />
          </div>
          <div class="form-group">
            <label for="bi">BI do cliente: </label>
            <input type="text" name="bi" id="bi" placeholder="" />
          </div>
          <button type="submit" form="form-new-sell" id="btn-submit">
            <i class="la la-save"></i>
            Concluir
          </button>
        </div>
      </div>

      <div id="loader">
        <p>Loading...</p>
      </div>
      <div class="menu-container">
        <div class="menu"></div>
      </div>
    </main>
    <footer>
      <p>CRONUS &copy; 2024</p>
    </footer>
  </body>
  <script src="../../js/config.js"></script>
  <script src="../../js/util.js"></script>
  <script src="../../js/components/index.js"></script>
  <script src="../../js/main.js"></script>
  <!-- <script src="../../js/asset/index.js"></script> -->
  <script>
    $(document).ready(function () {
      $(".select2").select2({
        data: [],
        placeholder: 'Código ou nome do item'
      });
    });
  </script>
  <script>
    let cart = [];
    let valor_total = 0;

    document
      .getElementById("form-new-sell")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const bi = document.getElementById("bi").value;

        if (cart.length === 0) {
          alert("Adicione pelo menos um producto ou serviço!");
          return;
        }

        // console.log('Cart', cart);

        document.querySelector("#btn-submit").disabled = true;

        const res = await fetch(api_url + "/cronus/sales/create", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            user: localStorage.getItem("user"),
          },
          body: JSON.stringify({ cart, bi, valor_total }),
        });

        if (res.status === 200) {
          Toast.fire({
            icon: "success",
            text: "Gravado com sucesso",
          }).then(async () => {
            const sell = await res.json();
            cart = [];
            document.getElementById("total-a-pagar");
            document.querySelector("thead").innerHTML = "";
            document.querySelector("tbody").innerHTML = "";
            document.getElementById("quantidade").value = 1;
            document.getElementById("total-a-pagar").innerHTML =
              "Total a pagar: " + formatCurrency(0);
            getStock();
            window.open(api_url + "/cronus-facturas/" + sell._id + ".pdf", '_blank');
          });
        }

        document.querySelector("#btn-submit").disabled = false;
      });

    //

    document
      .querySelector("#btn-add-product")
      .addEventListener("click", (e) => {
        e.preventDefault();
        addProducts();
      });

    getStock();

    async function getStock() {
      let trows = "";

      const res = await fetch(api_url + "/cronus/stock", {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          user: localStorage.getItem("user"),
        },
      });

      if (res.status === 200) {
        const data = await res.json();
        console.log("stock", data);
        let options = new String();
        for (c of data) {
          const { _id, desc, code, barcode } = c;
          options += `<option value='${_id}' preco='${
            c.valor
          }'>${barcode || ''} - ${desc} (${c.valor} MT)</option>`;
        }
        document.getElementById("select-product").innerHTML = options;
      }
    }

    //

    async function addProducts() {
      const selected = document.getElementById("select-product");
      const product = selected.value;
      const quantidade = document.getElementById("quantidade").value;

      const valor = product.valor;

      const product_label =
        document.getElementById("select-product").options[
          selected.selectedIndex
        ].text;

      if (cart.map((p) => p.product)?.includes(product)) {
        return;
      }

      if (!quantidade) {
        return;
      }

      cart.push({ product, quantidade, product_label, valor });
      console.log("cart", cart);

      const thead = `
          <th>Producto</th>
          <th>Quantidade</th>
          <th>Remover</th>`;

      let trows = new String();

      valor_total = 0;

      if (cart.length !== 0) {
        for (p of cart) {
          // Calcula total a pagar
          const preco = parseFloat(p.product_label.split("(")[1].split(" ")[0]);
          valor_total += preco * parseFloat(p.quantidade);

          trows += `
            <tr>
              <td>${p.product_label}</td>
              <td>${p.quantidade}</td>
              <td width='20%'>
                <button class="btn-circle btn-circle-delete btn-delete-staff" id="${p.product}"><i class='la la-trash'></i></button>
              </td>
            </tr>
          `;
        }

        document.querySelector("thead").innerHTML = thead;
        document.querySelector("tbody").innerHTML = trows;
        document.getElementById("total-a-pagar").innerHTML =
          "Total a pagar: " + formatCurrency(valor_total) + " MT";

        document.querySelectorAll(".btn-delete-staff").forEach((btn) => {
          btn.addEventListener("click", (evt) => {
            valor_total = 0;
            const id = evt.target.id;
            cart = cart.filter(({ product }) => product !== id);
            trows = "";
            for (p of cart) {
              console.log(p);
              const preco = parseFloat(
                p.product_label.split("(")[1].split(" ")[0]
              );
              valor_total += preco * parseFloat(p.quantidade);
              trows += `
                <tr>
                  <td>${p.product_label}</td>
                  <td>${p.quantidade}</td>
                  <td width='20%'>
                    <button class="btn-circle btn-circle-delete btn-delete-staff" id="${p.product}"><i class='la la-trash'></i></button>
                  </td>
                </tr>
              `;
            }

            document.querySelector("thead").innerHTML = thead;
            document.querySelector("tbody").innerHTML = trows;
            document.getElementById("total-a-pagar").innerHTML =
              "Total a pagar: " + formatCurrency(valor_total) + " MT";
          });
        });
      }
    }

    wakeupAPI();
  </script>
</html>
